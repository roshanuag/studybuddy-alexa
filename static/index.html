<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyBuddy</title>
</head>
<body>
  <h1>StudyBuddy</h1>
  <button id="startBtn">Start session</button>
  <div id="log"></div>

  <input id="msgInput" type="text" placeholder="Type a message..." disabled>
  <button id="sendBtn" disabled>Send</button>
  <button id="micBtn" disabled>🎤 Speak</button>

  <script>
    const log = document.getElementById("log");
    const input = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");

    function addMessage(who, text) {
      const p = document.createElement("p");
      p.textContent = `${who}: ${text}`;   // textContent, not innerHTML (safer)
      log.appendChild(p);
    }

    function speak(text) {
      speechSynthesis.cancel();                       // stop any earlier speech
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      speechSynthesis.speak(utterance);
    }

    // One helper for all POST requests, so error handling lives in one place
    async function post(url, body) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {})
      });
      if (!res.ok) throw new Error(`Server error ${res.status}`);
      return (await res.json()).reply;
    }

    function setBusy(busy) {
      input.disabled = busy;
      sendBtn.disabled = busy;
      micBtn.disabled = busy;
    }

    document.getElementById("startBtn").addEventListener("click", async () => {
      addMessage("System", "Starting...");
      setBusy(true);
      try {
        const reply = await post("/start");
        addMessage("StudyBuddy", reply);
        speak(reply);

      } 
        catch (err) {
        addMessage("System", "Could not start: " + err.message);
      }
      setBusy(false);
      input.focus();
    });

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;                    // ignore empty messages
      addMessage("You", text);
      input.value = "";
      setBusy(true);
      try {
        const reply = await post("/chat", { message: text });
        addMessage("StudyBuddy", reply);
        speak(reply);
      } 
      catch (err) {
        addMessage("System", "Error: " + err.message);
      }
      setBusy(false);
      input.focus();
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

        const micBtn = document.getElementById("micBtn");
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = "en-IN";              // tuned for Indian English accents
      recognition.interimResults = false;      // only give us the final result

      micBtn.addEventListener("click", () => {
        speechSynthesis.cancel();              // stop speaking so it doesn't hear itself
        micBtn.textContent = "Listening...";
        recognition.start();
      });

      recognition.addEventListener("result", (e) => {
        input.value = e.results[0][0].transcript;   // put what you said in the box
        input.focus();                              // so you can edit, then press Enter                            // reuse the same send logic
      });

      recognition.addEventListener("end", () => {
        micBtn.textContent = "🎤 Speak";
      });

      recognition.addEventListener("error", (e) => {
        addMessage("System", "Mic error: " + e.error);
      });
    } else {
      micBtn.style.display = "none";
      addMessage("System", "Voice input isn't supported here. Please use Chrome or Edge.");
    }
  </script>
</body>
</html>
